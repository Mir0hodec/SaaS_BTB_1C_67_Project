# Скопировать в settings.yaml (setup.ps1 делает это сам). Секреты сюда НЕ
# пишутся — только имена переменных окружения (или строк в .env).

claude:
  binary: "claude"              # для проверки без подписки: "scripts/mock_claude.cmd"
  model: "claude-opus-5-5"      # всегда полное имя модели
  effort: "high"
  config_dir: ""                # пусто — вход в подписку, который уже сделан на сервере
  timeout_seconds: 900
  max_turns: 60
  mcp_timeout_ms: 30000

connect:                        # сотрудники пишут в линию «ИИ-помощник» — вебхук, ответы от учётки бота
  api_base_url: "https://push.1c-connect.com"
  api_login_env: "CONNECT_API_LOGIN"
  api_password_env: "CONNECT_API_PASSWORD"
  webhook_token_env: "CONNECT_WEBHOOK_TOKEN"   # генерируется сам при первом запуске
  line_id: ""                   # своя линия «ИИ-помощник» — заполняет scripts/connect_line_setup.py
  bot_specialist_id: ""         # пусто — берётся из CONNECT_BOT_SPECIALIST_ID
  webhook_mode: "tunnel"        # tunnel — HTTPS через Cloudflare без домена и сертификата
  public_url: ""                # только для webhook_mode: url
  ack_text: "Принял, работаю над ответом…"   # сразу в ответ: у линии 30 секунд, иначе обращение уйдёт специалисту
  max_message_chars: 4000
  file_download_hosts: ["buhphone.com", "1c-connect.com"]
  max_attachment_mb: 20
  batch_seconds: 4              # картинка и текст, пришедшие подряд, — один вопрос

# API-мост: тот же помощник для внутренних сервисов (Langflow и т.п.)
api:
  clients:
    - name: "langflow"
      token_env: "ASSISTANT_API_TOKEN_LANGFLOW"
      bases: "*"

session:
  idle_timeout_minutes: 480     # через 8 часов тишины разговор начинается заново; вернуться — /продолжить
  data_dir: ".data"             # SQLite (сессии, журнал) и рабочие папки

# Поиск по коду 1С (onec_rag/README.md). Нет файла конфига — инструменты не подключаются.
onec_code:
  config_path: "onec_rag/config.json"

port: 8010                      # локальный порт моста, наружу не открывается
# Сборка внешних обработок и отчётов на сервере (scripts/install_1c_skills.ps1).
dev:
  v8_path: ""                   # пусто — последняя 8.3 в Program Files/1cv8; иначе каталог bin платформы

users_path: "config/users.yaml"
bases_path: "config/bases.yaml"

knowledge_base:
  root: "База знаний"
  index_path: ".index/kb.sqlite3"
  exclude:
    - pattern: "обменные пункты количество касс.xlsx"
      reason: "список клиентов с БИН — не для общей базы знаний"
    - pattern: "*.xlsm"
      reason: "шаблон отчётности с макросами; справочники кодов засоряют поиск"
    - pattern: "!!! Руководство ПО Обменный пункт. 2024*"
      reason: "старая версия — есть «Руководство … 2025»"
