# Кто может пользоваться помощником.
#
# Линия помощника в 1С-Коннект — внутренняя: писать в неё могут только те,
# кого вы к ней подключили. Поэтому по умолчанию бот отвечает всем, кто
# пишет в эту линию, и собирать user_id не нужно.
allow_all: true
default_bases: "*"        # базы для всех; можно список: [demo_base, acme_ut]
deny: []                  # UUID, кому бот не отвечает (например, их обслуживает другой бот)

# Особые права. Свой user_id сотрудник узнаёт, написав боту /id.
users:
  "впишите-сюда-user_id-из-команды-/id":
    name: "Руководитель"
    bases: "*"
    owner: true           # может ставить бота на паузу: /пауза, /старт
