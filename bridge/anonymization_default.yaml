# Что обезличивать в опубликованных базах (расширение MCP_HTTPService 0.5+).
# Правила по умолчанию; свои — в config/anonymization.yaml (их пишет панель, раздел «Базы 1С → Обезличивание»).
# Мост отправляет правила в каждую базу; такие же зашиты в расширение на случай, если моста ещё не было.
#
# categories — какие категории скрывать (убрать строку — категория не скрывается):
#   ФЛ имена людей, ОРГ организации и контрагенты, ИИН ИИН/БИН/РНН, ТЕЛ телефоны, EMAIL почта,
#   АДР адреса, СЧЕТ банковские счета, КАРТА номера карт, ДОК номера документов, ДОГ договоры,
#   УДЛ паспорта и удостоверения, КОД прочие коды и номера.
# tables — подстрока имени объекта или реквизита-ссылки → категория: чьё это наименование, код, ссылка.
# tables_all — у этих таблиц скрываются все строковые поля.
# fields — подстрока имени поля → категория («=Имя» — точное совпадение).
# keep — поля, которые не трогаются никогда (сюда — то, что скрывать не нужно).
# patterns — что искать в любом тексте: EMAIL, ИИН (12 цифр), ТЕЛ, КАРТА (16 цифр), СЧЕТ (IBAN, 20 цифр).
enabled: true
categories: [ФЛ, ОРГ, ИИН, ТЕЛ, EMAIL, АДР, СЧЕТ, КАРТА, ДОК, ДОГ, УДЛ, КОД]
tables:
  - [Договор, ДОГ]
  - [БанковскиеСчета, СЧЕТ]
  - [БанковскийСчет, СЧЕТ]
  - [ЛицевыеСчета, КОД]
  - [ЛицевойСчет, КОД]
  - [ФизическиеЛица, ФЛ]
  - [ФизическоеЛицо, ФЛ]
  - [ФизЛиц, ФЛ]
  - [Сотрудник, ФЛ]
  - [Пользовател, ФЛ]
  - [КонтактныеЛица, ФЛ]
  - [КонтактноеЛицо, ФЛ]
  - [Ответственн, ФЛ]
  - [Руководител, ФЛ]
  - [Бухгалтер, ФЛ]
  - [Кассир, ФЛ]
  - [Абонент, ФЛ]
  - [Собственник, ФЛ]
  - [Жилец, ФЛ]
  - [Житель, ФЛ]
  - [Подотчет, ФЛ]
  - [Контрагент, ОРГ]
  - [Организаци, ОРГ]
  - [Партнер, ОРГ]
  - [Клиент, ОРГ]
  - [Покупател, ОРГ]
  - [Поставщик, ОРГ]
  - [Арендатор, ОРГ]
  - [Получател, ОРГ]
  - [Плательщик, ОРГ]
  - [Документ., ДОК]
tables_all:
  - [КонтактнаяИнформация, АДР]
  - [КонтактнойИнформации, АДР]
fields:
  - [ИИН, ИИН]
  - [БИН, ИИН]
  - [ИНН, ИИН]
  - [РНН, ИИН]
  - [ИдентификационныйНомер, ИИН]
  - [ИдентификационныйКод, ИИН]
  - [ОКПО, КОД]
  - [Телефон, ТЕЛ]
  - [Факс, ТЕЛ]
  - [Мобильн, ТЕЛ]
  - [Email, EMAIL]
  - [ЭлектроннаяПочта, EMAIL]
  - [ЭлПочта, EMAIL]
  - [E_mail, EMAIL]
  - [Адрес, АДР]
  - [Фамилия, ФЛ]
  - [Отчество, ФЛ]
  - [ФИО, ФЛ]
  - [Инициалы, ФЛ]
  - ["=Имя", ФЛ]
  - [IBAN, СЧЕТ]
  - [НомерСчета, СЧЕТ]
  - [ИИК, СЧЕТ]
  - [РасчетныйСчет, СЧЕТ]
  - ["=СИК", СЧЕТ]
  - [НомерКарт, КАРТА]
  - [Паспорт, УДЛ]
  - [Удостоверени, УДЛ]
  - [ДокументУдостоверяющ, УДЛ]
  - [СерияДокумента, УДЛ]
  - [НомерДокумента, УДЛ]
  - [КемВыдан, УДЛ]
  - ["=Номер", ДОК]
  - [НомерВходящ, ДОК]
  - [ВходящийНомер, ДОК]
  - [Свидетельств, КОД]
  - [НалоговойРегистрации, КОД]
  - [КодВСтранеРегистрации, КОД]
  - [НомерДоговора, ДОГ]
  - [НаименованиеИностр, ОРГ]
keep: [НомерСтроки]
patterns: [EMAIL, ИИН, ТЕЛ, КАРТА, СЧЕТ]
